<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReginaldMinecraft Messenger</title>
  <!-- PeerJS for Video & Voice Calls -->
  <script src="https://unpkg.com"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #1e1f22; color: #f2f3f5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    header { background: #2b2d31; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #111; }
    .container { display: flex; flex: 1; overflow: hidden; }
    .chat-section { flex: 2; display: flex; flex-direction: column; padding: 15px; }
    .call-section { flex: 1; background: #2b2d31; padding: 15px; display: flex; flex-direction: column; gap: 10px; border-left: 1px solid #111; }
    #messages { flex: 1; overflow-y: auto; background: #313338; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
    .msg { margin-bottom: 8px; line-height: 1.4; }
    .msg strong { color: #5865f2; }
    .input-row { display: flex; gap: 8px; }
    input { padding: 10px; border-radius: 5px; border: none; background: #383a40; color: white; flex: 1; }
    button { padding: 10px 15px; border-radius: 5px; border: none; background: #5865f2; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #4752c4; }
    button.end-btn { background: #da373c; }
    video { width: 100%; background: #000; border-radius: 8px; max-height: 220px; object-fit: cover; }
    .id-box { background: #1e1f22; padding: 8px; border-radius: 5px; font-size: 0.9em; word-break: break-all; }
  </style>
</head>
<body>

<header>
  <div><strong>ReginaldMinecraft Messenger</strong></div>
  <div>
    <input type="text" id="username" placeholder="Your Name" value="Guest" style="width: 140px;">
  </div>
</header>

<div class="container">
  <!-- Live Text Chat -->
  <div class="chat-section">
    <div id="messages"></div>
    <div class="input-row">
      <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <!-- Video & Voice Calls -->
  <div class="call-section">
    <h3>Voice & Video Call</h3>
    <div class="id-box">Your Call ID: <strong id="my-id">Connecting...</strong></div>
    <div class="input-row">
      <input type="text" id="peer-id-input" placeholder="Paste friend's Call ID">
      <button onclick="startCall()">Call</button>
    </div>
    <button class="end-btn" onclick="endCall()">End Call</button>
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay muted playsinline></video>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://gstatic.com";
  import { getDatabase, ref, push, onChildAdded } from "https://gstatic.com";

  // PASTE YOUR FIREBASE CONFIG BELOW
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_://firebaseapp.com",
    databaseURL: "https://YOUR_://firebaseio.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_://appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const messagesRef = ref(db, 'messages');

  window.sendMessage = function() {
    const input = document.getElementById('msgInput');
    const user = document.getElementById('username').value.trim() || 'Guest';
    const text = input.value.trim();
    if (!text) return;

    push(messagesRef, { user: user, text: text });
    input.value = '';
  };

  onChildAdded(messagesRef, (snapshot) => {
    const data = snapshot.val();
    const box = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg';
    div.innerHTML = `<strong>${escapeHTML(data.user)}:</strong> ${escapeHTML(data.text)}`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  });

  function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, tag => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[tag]));
  }
</script>

<!-- PeerJS Calling Logic -->
<script>
  const peer = new Peer();
  let currentCall = null;
  let localStream = null;

  peer.on('open', (id) => {
    document.getElementById('my-id').textContent = id;
  });

  peer.on('call', async (call) => {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    document.getElementById('local-video').srcObject = localStream;
    call.answer(localStream);
    handleCall(call);
  });

  async function startCall() {
    const remoteId = document.getElementById('peer-id-input').value.trim();
    if (!remoteId) return alert('Enter a friend\'s Call ID first.');
    
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    document.getElementById('local-video').srcObject = localStream;
    const call = peer.call(remoteId, localStream);
    handleCall(call);
  }

  function handleCall(call) {
    if (currentCall) currentCall.close();
    currentCall = call;
    call.on('stream', (remoteStream) => {
      document.getElementById('remote-video').srcObject = remoteStream;
    });
  }

  function endCall() {
    if (currentCall) currentCall.close();
    if (localStream) localStream.getTracks().forEach(track => track.stop());
    document.getElementById('remote-video').srcObject = null;
    document.getElementById('local-video').srcObject = null;
  }
</script>

</body>
</html>
